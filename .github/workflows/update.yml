name: Update Site

on:
  schedule:
    - cron: "0 1,9,17 * * *"
  workflow_dispatch:

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch feeds
        run: python -m scripts.fetch_feeds

      - name: Build site
        run: python -m scripts.build_site

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/items.json docs/
          git diff --cached --quiet || git commit -m "chore: update feed data and rebuild site"
          git push
