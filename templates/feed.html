{% extends "base.html" %}
{% block title %}新着情報 - ファッショントレンド速報{% endblock %}
{% block content %}

<div class="section-head">
  <h2>新着情報</h2>
</div>
<div class="feed-list">
{% for item in items %}
  <div class="feed-item">
    <div class="thumb{% if not item.image_url %} no-image{% endif %}">
      {% if item.image_url %}<img src="{{ item.image_url }}" alt="{{ item.title }}">{% endif %}
    </div>
    <div>
      <a class="title" href="{{ item.url }}">{{ item.title }}</a>
      <div class="meta">{{ item.source }} / {{ item.published }}</div>
      <p class="excerpt">{{ item.summary | excerpt }}</p>
    </div>
  </div>
{% endfor %}
</div>

{% endblock %}
