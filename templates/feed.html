<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>新着情報 - ファッショントレンド速報</title></head>
<body>
<p><a href="index.html">トップへ戻る</a></p>
<h1>新着情報</h1>
<ul>
{% for item in items %}
  <li>
    {% if item.image_url %}<img src="{{ item.image_url }}" alt="{{ item.title }}" width="120">{% endif %}
    <a href="{{ item.url }}">{{ item.title }}</a>
    <div>{{ item.source }} / {{ item.published }}</div>
    <p>{{ item.summary | excerpt }}</p>
  </li>
{% endfor %}
</ul>
</body>
</html>
