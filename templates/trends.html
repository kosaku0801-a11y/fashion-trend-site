{% extends "base.html" %}
{% block title %}トレンド分析 - ファッショントレンド速報{% endblock %}
{% block content %}

<div class="section-head">
  <h2>トレンド分析</h2>
</div>
{% if trends %}
<div class="trend-grid">
{% for post in trends %}
  <a class="trend-card" href="{{ post.slug }}.html">
    <div class="trend-date">{{ post.date }}</div>
    <div class="trend-title">{{ post.title }}</div>
  </a>
{% endfor %}
</div>
{% else %}
<div class="trend-empty">
  <span class="stamp-inline">COMING SOON</span>
  <p>週次のトレンド分析記事は準備中です。</p>
</div>
{% endif %}

{% endblock %}
